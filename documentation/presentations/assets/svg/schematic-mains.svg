<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="20 12 610 400" width="2440" height="1600"><style>
.zone-m{fill:#c2362b;fill-opacity:.06}
.zone-l{fill:#1f6fb5;fill-opacity:.05}
.wm,.ws,.wp,.wd{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wm{stroke:#c2362b}.ws{stroke:#1f6fb5}.wp{stroke:#a9650a}.wd{stroke:#5d6a73;stroke-width:1.8}
.part{fill:#fff;stroke:#1b2227;stroke-width:1.6}
.block{fill:#fff;stroke:#1b2227;stroke-width:1.8}
.thin{fill:none;stroke:#1b2227;stroke-width:1.6;stroke-linecap:round}
.gnd{fill:none;stroke:#1f6fb5;stroke-width:1.8;stroke-linecap:round}
.barrier{stroke:#1b2227;stroke-width:1.4;stroke-dasharray:7 5}
.dot-m{fill:#c2362b}.dot-s{fill:#1f6fb5}.dot-p{fill:#a9650a}
.a-m{fill:#c2362b}.a-s{fill:#1f6fb5}.a-p{fill:#a9650a}.a-d{fill:#5d6a73}
text{fill:#1b2227;font-family:'Liberation Sans',Arial,sans-serif;font-size:13px}
.b{font-weight:700;font-size:14px}
.mono{font-family:'Liberation Mono','Courier New',monospace;font-size:12px}
.dim{fill:#5d6a73;font-size:12px}
.zone-label{fill:#5d6a73;font-size:12px;letter-spacing:.08em;font-weight:700}
.tm{fill:#c2362b}.ts{fill:#1f6fb5}.tp{fill:#a9650a}
.core{fill:#cfd6db;stroke:#1b2227;stroke-width:1.6;fill-rule:evenodd}
.turn{stroke:#1f6fb5;stroke-width:3;stroke-linecap:round;fill:none}
.flux{fill:none;stroke:#5d6a73;stroke-width:2;stroke-dasharray:6 5}
.badge{fill:#1b2227}
.badge-t{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
.grid{stroke:#cfd6db;stroke-width:1;fill:none}
.axis{stroke:#5d6a73;stroke-width:1.2;fill:none}
.curve{fill:none;stroke:#1f6fb5;stroke-width:2.6}
.wave-in{fill:none;stroke:#5d6a73;stroke-width:1.4;stroke-linejoin:round}
.wave-out{fill:none;stroke:#1f6fb5;stroke-width:2.6}
.band-sig{fill:#1f6fb5;fill-opacity:.13}
.band-noise{fill:#c2362b;fill-opacity:.10}
.vline{stroke:#1b2227;stroke-width:1.2;stroke-dasharray:4 4;fill:none}
</style><rect x="-200" y="-200" width="1800" height="1400" fill="#ffffff"/>
        <defs>
          <g id="gnd"><path class="gnd" d="M0 0 v6 M-9 6 h18 M-6 10 h12 M-3 14 h6"/></g>
        </defs>

        <!-- zones -->
        <rect class="zone-m" x="20" y="20" width="1160" height="300" rx="4"/>
        <rect class="zone-l" x="20" y="320" width="1160" height="465" rx="4"/>
        <text class="zone-label tm" x="1160" y="100" text-anchor="end">MAINS SIDE · 230 V · HAZARDOUS</text>
        <text class="zone-label ts" x="1160" y="772" text-anchor="end">LOW-VOLTAGE SIDE</text>

        <!-- ===== MAINS SIDE ===== -->
        <!-- live wire pass-through -->
        <path class="wm" d="M40 60 H1150"/>
        <polygon class="a-m" points="1148,53 1162,60 1148,67"/>
        <circle class="dot-m" cx="40" cy="60" r="4"/>
        <text x="40" y="44" class="mono tm">L in</text>
        <text x="1160" y="44" text-anchor="end" class="dim">to home loads (from main MCB →)</text>

        <!-- CT -->
        <ellipse class="thin" cx="90" cy="60" rx="13" ry="25"/>
        <text x="116" y="32" class="b">Split-core CT</text>
        <text x="116" y="49" class="dim">clamps the L wire only</text>
        <path class="ws" d="M80 84 V740"/>
        <path class="ws" d="M100 85 V660"/>
        <text x="112" y="430" class="dim">CT leads: current,</text>
        <text x="112" y="446" class="dim">mA-level, isolated</text>

        <!-- fused tap -->
        <circle class="dot-m" cx="170" cy="60" r="4"/>
        <path class="wm" d="M170 60 V92 M170 128 V140 H1010 V250"/>
        <rect class="part" x="162" y="92" width="16" height="36"/>
        <path class="thin" d="M170 92 V128"/>
        <text x="190" y="115" class="dim">fuse</text>
        <text x="560" y="132" class="mono tm">L (fused)</text>

        <!-- neutral -->
        <circle class="dot-m" cx="140" cy="190" r="4"/>
        <text x="140" y="212" text-anchor="middle" class="mono tm">N in</text>
        <path class="wm" d="M140 190 H910 V250"/>
        <text x="560" y="182" class="mono tm">N</text>

        <!-- MOV -->
        <path class="wm" d="M260 140 V152 M260 178 V190"/>
        <rect class="part" x="252" y="152" width="16" height="26"/>
        <path class="thin" d="M254 174 L266 156"/>
        <circle class="dot-m" cx="260" cy="140" r="3.5"/>
        <circle class="dot-m" cx="260" cy="190" r="3.5"/>
        <text x="280" y="170" class="dim">MOV, surge clamp</text>

        <!-- transformer drop with a hop over N -->
        <circle class="dot-m" cx="430" cy="140" r="3.5"/>
        <path class="wm" d="M430 140 V182 A8 8 0 0 1 430 198 V250"/>
        <circle class="dot-m" cx="350" cy="190" r="3.5"/>
        <path class="wm" d="M350 190 V250"/>

        <!-- Voltage transformer block -->
        <rect class="block" x="310" y="250" width="160" height="140" rx="3"/>
        <text x="390" y="276" text-anchor="middle" class="b">Voltage transformer</text>
        <text x="390" y="296" text-anchor="middle" class="dim">230 V in, ~9 V AC out</text>
        <text x="390" y="350" text-anchor="middle" class="dim">isolated secondary</text>

        <!-- AC-DC module block -->
        <rect class="block" x="880" y="250" width="160" height="140" rx="3"/>
        <text x="960" y="276" text-anchor="middle" class="b">AC-DC module</text>
        <text x="960" y="296" text-anchor="middle" class="dim">85–265 V AC in, 5 V out</text>
        <text x="960" y="350" text-anchor="middle" class="dim">isolated 5 V output</text>

        <!-- barrier -->
        <line class="barrier" x1="20" y1="320" x2="1180" y2="320"/>
        <text x="700" y="312" text-anchor="middle" class="zone-label">ISOLATION BARRIER</text>

        <!-- ===== LOW-VOLTAGE SIDE ===== -->
        <!-- voltage chain -->
        <path class="ws" d="M350 390 V430"/><use xlink:href="#gnd" x="350" y="430"/>
        <path class="ws" d="M430 390 V440 M430 476 V550 M430 550 V566 M430 602 V622"/>
        <rect class="part" x="422" y="440" width="16" height="36"/>
        <rect class="part" x="422" y="566" width="16" height="36"/>
        <use xlink:href="#gnd" x="430" y="622"/>
        <circle class="dot-s" cx="430" cy="550" r="3.5"/>
        <text x="448" y="462" class="dim">R1 / R2 divider</text>
        <path class="ws" d="M430 550 H470 M506 550 H700"/>
        <rect class="part" x="470" y="542" width="36" height="16"/>
        <circle class="dot-s" cx="550" cy="550" r="3.5"/>
        <path class="ws" d="M550 550 V578 M550 584 V622"/>
        <path class="thin" d="M538 578 H562 M538 584 H562"/>
        <use xlink:href="#gnd" x="550" y="622"/>
        <text x="462" y="534" class="dim">Rf + Cf anti-alias</text>
        <text x="302" y="476" class="b ts" text-anchor="end">VOLTAGE</text>

        <!-- current chain -->
        <path class="ws" d="M100 660 H230 M266 660 H700"/>
        <rect class="part" x="230" y="652" width="36" height="16"/>
        <circle class="dot-s" cx="170" cy="660" r="3.5"/>
        <path class="ws" d="M170 660 V680 M170 716 V740"/>
        <rect class="part" x="162" y="680" width="16" height="36"/>
        <use xlink:href="#gnd" x="170" y="740"/>
        <circle class="dot-s" cx="310" cy="660" r="3.5"/>
        <path class="ws" d="M310 660 V688 M310 694 V740"/>
        <path class="thin" d="M298 688 H322 M298 694 H322"/>
        <use xlink:href="#gnd" x="310" y="740"/>
        <use xlink:href="#gnd" x="80" y="740"/>
        <text x="186" y="704" class="dim">Rb burden</text>
        <text x="230" y="640" class="dim">Rf + Cf anti-alias</text>
        <text x="330" y="728" class="b ts">CURRENT</text>

        <!-- ADC -->
        <rect class="block" x="700" y="470" width="180" height="285" rx="3"/>
        <text x="790" y="496" text-anchor="middle" class="b">ADS131M04</text>
        <text x="790" y="514" text-anchor="middle" class="dim">24-bit Δ-Σ, simultaneous</text>
        <text x="710" y="554" class="mono">CH0 +  voltage</text>
        <text x="710" y="594" class="mono">CH0 −</text>
        <text x="710" y="664" class="mono">CH1 +  current</text>
        <text x="710" y="704" class="mono">CH1 −</text>
        <text x="710" y="740" class="mono dim">CH2, CH3 spare</text>
        <path class="ws" d="M700 590 H680"/><use xlink:href="#gnd" x="680" y="590"/>
        <path class="ws" d="M700 700 H680"/><use xlink:href="#gnd" x="680" y="700"/>

        <!-- module outputs and power -->
        <path class="wp" d="M910 390 V392"/><use xlink:href="#gnd" x="910" y="390"/>
        <path class="wp" d="M1010 390 V430 M1010 430 H1040 M1010 430 H900"/>
        <circle class="dot-p" cx="1010" cy="430" r="3.5"/>
        <text x="1020" y="410" class="mono tp">+5 V</text>
        <rect class="block" x="760" y="414" width="140" height="32" rx="3"/>
        <text x="830" y="435" text-anchor="middle" class="dim">LDO 3.3 V analog</text>
        <rect class="block" x="1040" y="414" width="130" height="32" rx="3"/>
        <text x="1105" y="435" text-anchor="middle" class="dim">LDO 3.3 V digital</text>
        <path class="wp" d="M830 446 V462"/><polygon class="a-p" points="824,460 830,470 836,460"/>
        <text x="840" y="462" class="mono tp">AVDD</text>
        <path class="wp" d="M1105 446 V500"/><polygon class="a-p" points="1099,498 1105,510 1111,498"/>
        <text x="1114" y="482" class="mono tp">3.3 V</text>

        <!-- ESP32 -->
        <rect class="block" x="1000" y="510" width="170" height="245" rx="3"/>
        <text x="1085" y="534" text-anchor="middle" class="b">ESP32-S3</text>
        <text x="1085" y="566" text-anchor="middle" class="dim">calibration + DSP</text>
        <text x="1085" y="584" text-anchor="middle" class="dim">P · Q · RMS · harmonics</text>
        <text x="1085" y="602" text-anchor="middle" class="dim">event detection</text>
        <text x="1085" y="620" text-anchor="middle" class="dim">PSRAM waveform buffer</text>
        <text x="1085" y="742" text-anchor="middle" class="dim">Wi-Fi · MQTT/TLS → cloud</text>

        <!-- SPI and control wires -->
        <path class="wd" d="M1000 550 H884"/><polygon class="a-d" points="892,544 880,550 892,556"/>
        <text x="940" y="543" text-anchor="middle" class="mono">SCLK</text>
        <path class="wd" d="M1000 580 H884"/><polygon class="a-d" points="892,574 880,580 892,586"/>
        <text x="940" y="573" text-anchor="middle" class="mono">MOSI</text>
        <path class="wd" d="M880 610 H996"/><polygon class="a-d" points="988,604 1000,610 988,616"/>
        <text x="940" y="603" text-anchor="middle" class="mono">MISO</text>
        <path class="wd" d="M1000 640 H884"/><polygon class="a-d" points="892,634 880,640 892,646"/>
        <text x="940" y="633" text-anchor="middle" class="mono">CS</text>
        <path class="wd" d="M880 670 H996"/><polygon class="a-d" points="988,664 1000,670 988,676"/>
        <text x="940" y="663" text-anchor="middle" class="mono">DRDY</text>
        <path class="wd" d="M1000 700 H884"/><polygon class="a-d" points="892,694 880,700 892,706"/>
        <text x="940" y="693" text-anchor="middle" class="mono">CLKIN</text>
        <path class="wd" d="M1000 730 H884"/><polygon class="a-d" points="892,724 880,730 892,736"/>
        <text x="940" y="723" text-anchor="middle" class="mono">RESET</text>
      </svg>